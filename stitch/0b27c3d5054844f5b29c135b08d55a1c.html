<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .ghost-grid {
            background-image: 
                linear-gradient(to right, #334155 1px, transparent 1px),
                linear-gradient(to bottom, #334155 1px, transparent 1px);
            background-size: calc(100% / 10) calc(100% / 20);
        }
        .neon-glow-primary {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        .focus-ring:focus-within {
            outline: 2px solid #F8FAFC;
            outline-offset: 0;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- Background Tetris Stack Representation -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none flex justify-center items-end pb-xl">
<div class="w-full max-w-[400px] h-3/4 ghost-grid border-2 border-surface-variant relative flex flex-col-reverse p-board-gutter gap-board-gutter">
<!-- Simulated Blocks -->
<div class="h-[calc(100%/20)] w-[calc(100%/10*4)] bg-[#0ea5e9] ml-[calc(100%/10*3)] rounded-sm"></div>
<div class="h-[calc(100%/20*2)] w-[calc(100%/10*2)] bg-[#eab308] ml-[calc(100%/10*2)] rounded-sm"></div>
<div class="h-[calc(100%/20)] w-[calc(100%/10*3)] bg-[#a855f7] ml-[calc(100%/10*6)] rounded-sm"></div>
<div class="h-[calc(100%/20*2)] w-[calc(100%/10*2)] bg-[#ef4444] ml-[calc(100%/10)] rounded-sm"></div>
</div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-md px-md flex flex-col items-center gap-xl">
<!-- Header / Brand -->
<div class="text-center">
<h1 class="font-display-score text-display-score text-primary tracking-tighter neon-glow-primary inline-block">TETRA</h1>
<h2 class="font-headline-md text-headline-md text-primary-fixed-dim tracking-widest mt-base">SUPERVISOR</h2>
</div>
<!-- Action Menu -->
<nav class="w-full flex flex-col gap-md">
<!-- Primary Actions Group -->
<div class="flex flex-col gap-sm">
<button class="focus-ring bg-primary text-on-primary font-headline-md text-headline-md h-[64px] rounded flex items-center justify-center w-full transition-transform hover:scale-[1.02] active:scale-[0.98]">
                    START GAME
                </button>
<div class="flex gap-sm">
<button class="flex-1 border-2 border-surface-variant bg-surface-container-lowest text-on-surface-variant font-label-mono text-label-mono h-touch-target rounded flex items-center justify-center opacity-50 cursor-not-allowed" disabled="">
                        RESUME
                    </button>
<button class="focus-ring flex-1 border-2 border-surface-variant bg-transparent text-primary font-label-mono text-label-mono h-touch-target rounded flex items-center justify-center hover:bg-surface-variant transition-colors">
                        RESTART
                    </button>
</div>
</div>
<div class="w-full border-t border-surface-variant my-xs"></div>
<!-- Secondary Actions Group -->
<div class="flex flex-col gap-base w-full max-w-[240px] mx-auto">
<button class="focus-ring group flex items-center justify-between p-xs text-on-surface-variant hover:text-primary transition-colors border-b border-surface-variant">
<span class="font-label-mono text-label-mono">LEADERBOARD</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<button class="focus-ring group flex items-center justify-between p-xs text-on-surface-variant hover:text-primary transition-colors border-b border-surface-variant">
<span class="font-label-mono text-label-mono">SETTINGS</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
<button class="focus-ring group flex items-center justify-between p-xs text-on-surface-variant hover:text-primary transition-colors border-b border-surface-variant">
<span class="font-label-mono text-label-mono">HOW TO PLAY</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">chevron_right</span>
</button>
</div>
</nav>
<!-- System Status Footer -->
<div class="mt-lg text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">SYSTEM v2.4.1 // READY</p>
</div>
</main>
</body></html>
