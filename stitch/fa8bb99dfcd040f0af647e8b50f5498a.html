<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tetris Supervisor Manager - Game Over</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "surface-dim": "#131313",
                        "secondary-container": "#3c4a5e",
                        "tertiary-container": "#e7e2d9",
                        "tertiary-fixed-dim": "#cbc6bd",
                        "on-tertiary": "#32302a",
                        "inverse-surface": "#e5e2e1",
                        "on-surface": "#e5e2e1",
                        "on-tertiary-container": "#67645d",
                        "on-secondary": "#233144",
                        "surface": "#131313",
                        "surface-variant": "#353535",
                        "surface-tint": "#c4c7c9",
                        "on-surface-variant": "#c4c7c9",
                        "on-primary-container": "#626567",
                        "on-primary-fixed-variant": "#444749",
                        "surface-bright": "#3a3939",
                        "tertiary-fixed": "#e7e2d9",
                        "inverse-primary": "#5c5f61",
                        "secondary-fixed-dim": "#b9c7e0",
                        "primary-container": "#e0e3e5",
                        "secondary": "#b9c7e0",
                        "outline-variant": "#444749",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#353535",
                        "on-secondary-fixed": "#0d1c2f",
                        "on-tertiary-fixed": "#1d1b16",
                        "primary": "#ffffff",
                        "outline": "#8e9193",
                        "primary-fixed-dim": "#c4c7c9",
                        "tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#494640",
                        "surface-container-low": "#1c1b1b",
                        "background": "#131313",
                        "on-error": "#690005",
                        "on-secondary-container": "#abb9d2",
                        "on-background": "#e5e2e1",
                        "inverse-on-surface": "#313030",
                        "secondary-fixed": "#d5e3fd",
                        "surface-container-lowest": "#0e0e0e",
                        "on-primary-fixed": "#191c1e",
                        "surface-container-high": "#2a2a2a",
                        "surface-container": "#201f1f",
                        "on-primary": "#2d3133",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#3a485c",
                        "primary-fixed": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "touch_target": "44px",
                        "board_max_width": "400px",
                        "unit": "4px",
                        "margin_mobile": "16px",
                        "gutter": "16px",
                        "margin_desktop": "32px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "h2": ["Space Grotesk"],
                        "body-sm": ["Inter"],
                        "hud-label": ["JetBrains Mono"],
                        "h1": ["Space Grotesk"],
                        "button": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h2": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "hud-label": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "button": ["14px", { "lineHeight": "1.0", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .inset-border { box-shadow: inset 0 0 0 1px var(--tw-shadow-color); }
        .focus-ring:focus { outline: 2px solid #F8FAFC; outline-offset: 2px; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin_mobile md:p-margin_desktop antialiased">
<!-- Game Over Modal Canvas -->
<main class="w-full max-w-md relative z-10">
<!-- Background decorative grid (subtle) -->
<div class="absolute inset-0 -z-10 bg-[linear-gradient(to_right,#334155_1px,transparent_1px),linear-gradient(to_bottom,#334155_1px,transparent_1px)] bg-[size:40px_40px] opacity-10"></div>
<section aria-labelledby="game-over-title" class="bg-surface border border-outline-variant p-6 md:p-8 flex flex-col gap-6" role="dialog">
<!-- Header -->
<header class="text-center pb-4 border-b border-outline-variant">
<h1 class="font-h1 text-h1 text-error uppercase tracking-widest" id="game-over-title">Game Over</h1>
</header>
<!-- Stats Section -->
<div class="grid grid-cols-2 gap-4">
<!-- Final Score (Bento Style Card) -->
<article class="col-span-2 bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center gap-2 relative overflow-hidden">
<div class="absolute top-0 right-0 bg-error text-on-error px-2 py-1 font-hud-label text-hud-label uppercase flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">star</span>
                        New High Score
                    </div>
<span class="font-hud-label text-hud-label text-on-surface-variant uppercase tracking-widest mt-4">Final Score</span>
<span class="font-h1 text-h1 text-primary">24,800</span>
</article>
<!-- Lines Cleared -->
<article class="bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary text-2xl">clear_all</span>
<span class="font-hud-label text-hud-label text-on-surface-variant uppercase">Lines</span>
<span class="font-h2 text-h2 text-on-surface">85</span>
</article>
<!-- Time Played -->
<article class="bg-surface-container border border-outline-variant p-4 flex flex-col items-center justify-center gap-2">
<span class="material-symbols-outlined text-secondary text-2xl">timer</span>
<span class="font-hud-label text-hud-label text-on-surface-variant uppercase">Time</span>
<span class="font-h2 text-h2 text-on-surface">12:45</span>
</article>
</div>
<!-- Actions -->
<footer class="flex flex-col gap-4 mt-2">
<button class="w-full h-touch_target bg-primary text-background font-button text-button uppercase tracking-widest hover:bg-surface-variant hover:text-primary transition-colors focus-ring flex items-center justify-center gap-2">
<span class="material-symbols-outlined">replay</span>
                    Play Again
                </button>
<button class="w-full h-touch_target bg-transparent border border-outline-variant text-primary font-button text-button uppercase tracking-widest hover:bg-surface-variant transition-colors focus-ring flex items-center justify-center gap-2">
<span class="material-symbols-outlined">home</span>
                    Main Menu
                </button>
</footer>
</section>
</main>
</body></html>
