<!DOCTYPE html>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen relative overflow-hidden">
<div class="absolute inset-0 z-0 flex items-center justify-center opacity-30 filter blur-sm">
<div class="w-[300px] h-[600px] border-2 border-surface-variant flex flex-col gap-board-gutter p-board-gutter bg-surface-lowest">
<div class="grid grid-cols-10 grid-rows-20 gap-board-gutter w-full h-full">
<div class="col-start-4 row-start-19 bg-primary opacity-50 shadow-[0_0_15px_rgba(255,255,255,0.5)] h-full w-full"></div>
<div class="col-start-5 row-start-19 bg-primary opacity-50 shadow-[0_0_15px_rgba(255,255,255,0.5)] h-full w-full"></div>
<div class="col-start-6 row-start-19 bg-primary opacity-50 shadow-[0_0_15px_rgba(255,255,255,0.5)] h-full w-full"></div>
<div class="col-start-5 row-start-18 bg-primary opacity-50 shadow-[0_0_15px_rgba(255,255,255,0.5)] h-full w-full"></div>
</div>
</div>
</div>
<div class="absolute inset-0 z-10 bg-background/80 flex flex-col items-center justify-center backdrop-blur-md">
<div class="flex flex-col items-center mb-xl w-full max-w-md px-md">
<h1 class="font-display-score text-display-score text-primary mb-md tracking-widest uppercase" style="text-shadow: 0 0 20px rgba(255,255,255,0.3);">PAUSED</h1>
<div class="w-full bg-surface border border-surface-variant p-md mb-xl flex flex-col gap-sm">
<div class="flex justify-between items-end border-b border-surface-variant pb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Current Score</span>
<span class="font-label-mono text-label-mono text-primary text-xl">124,500</span>
</div>
<div class="flex justify-between items-end border-b border-surface-variant pb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Level</span>
<span class="font-label-mono text-label-mono text-secondary">14</span>
</div>
<div class="flex justify-between items-end border-b border-surface-variant pb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Lines Cleared</span>
<span class="font-label-mono text-label-mono text-on-background">87</span>
</div>
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Time</span>
<span class="font-label-mono text-label-mono text-on-background">04:21</span>
</div>
</div>
<div class="w-full flex flex-col gap-sm">
<button class="w-full h-touch-target bg-primary text-background font-headline-md text-headline-md uppercase hover:bg-white hover:scale-[0.98] transition-all flex items-center justify-center gap-xs focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    RESUME
                </button>
<button class="w-full h-touch-target bg-transparent border-2 border-surface-variant text-primary font-headline-md text-headline-md uppercase hover:border-primary hover:bg-surface-container transition-all flex items-center justify-center gap-xs focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined">refresh</span>
                    RESTART
                </button>
<button class="w-full h-touch-target bg-transparent border border-error-container text-error font-label-mono text-label-mono uppercase hover:bg-error-container hover:text-on-error-container transition-all flex items-center justify-center gap-xs mt-md focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 focus:ring-offset-background">
<span class="material-symbols-outlined">logout</span>
                    QUIT TO MENU
                </button>
</div>
</div>
</div>
